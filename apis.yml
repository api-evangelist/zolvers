name: Zolvers
description: >-
  Zolvers is a home-services marketplace that connects households with vetted,
  background-checked domestic and home-maintenance workers across Latin America,
  operating in Argentina, Mexico, Colombia, and Chile with a focus on Buenos
  Aires, Mexico City, Santiago, Bogotá, and Monterrey. The platform handles
  service requests, worker vetting, scheduling, and integrated payment
  processing for housekeeping and cleaning (one-time and live-in) plus home
  maintenance such as plumbing, electrical, gas, painting, air conditioning,
  general repairs, upholstery cleaning, and elder care. Backed by 500 Global,
  Zolvers is a consumer-facing platform with no public API or developer program
  at this time.
